<div class="selector" role="radiogroup" aria-label="Idioma / Language">
  <svg class="globo" viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="12" cy="12" r="9.5" />
    <path d="M2.5 12h19M12 2.5c2.6 2.8 3.9 6 3.9 9.5s-1.3 6.7-3.9 9.5c-2.6-2.8-3.9-6-3.9-9.5s1.3-6.7 3.9-9.5Z" />
  </svg>
  @for (idioma of idiomas; track idioma.codigo) {
    <button
      type="button"
      role="radio"
      [attr.aria-checked]="activo === idioma.codigo"
      [class.activo]="activo === idioma.codigo"
      [attr.lang]="idioma.codigo"
      [title]="idioma.nombre"
      (click)="elegir(idioma.codigo)"
    >
      <span class="corto">{{ idioma.corto }}</span>
      <span class="nombre">{{ idioma.nombre }}</span>
    </button>
  }
</div>
